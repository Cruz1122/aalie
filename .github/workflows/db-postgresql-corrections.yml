name: Temporary audited branch corrections

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: db-postgresql-corrections
  cancel-in-progress: false

jobs:
  correct-validate-publish:
    if: github.head_ref == 'db/postgresql-init'
    name: Correct, validate and publish branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: postgresql+psycopg://aalie_ci:aalie_ci_password@127.0.0.1:5432/aalie_ci
      POSTGRES_DB: aalie_ci
      POSTGRES_USER: aalie_ci
      POSTGRES_PASSWORD: aalie_ci_password
      API_DATABASE_URL: postgresql+psycopg://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci
      WEB_DATABASE_URL: postgresql://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      AUTH_JWT_ISSUER: http://localhost:3000
      AUTH_JWT_AUDIENCE: urn:aalie:api
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: aalie_ci
          POSTGRES_USER: aalie_ci
          POSTGRES_PASSWORD: aalie_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aalie_ci -d aalie_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: db/postgresql-init
          fetch-depth: 0

      - name: Apply audited corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              if old not in value:
                  raise RuntimeError(f"Expected block not found in {path}: {old[:120]!r}")
              write(path, value.replace(old, new, 1))

          # 1) Keep Better Auth 1.7.1. Remove session cookie caching so role
          # changes cannot mint a fresh JWT from a stale cached admin session.
          replace_once(
              "apps/web/src/lib/auth.ts",
              '''      cookieCache: {\n        enabled: true,\n        maxAge: 60 * 5,\n        strategy: "compact",\n      },\n''',
              "",
          )

          # 2) JWT security tests belong to the blocking fast/oracle PR gate.
          replace_once(
              "apps/api/tests/unit/auth/test_jwt_auth.py",
              '''from app.core import auth\n\n\ndef _b64''',
              '''from app.core import auth\n\npytestmark = [pytest.mark.fast, pytest.mark.unit]\n\n\ndef _b64''',
          )

          # 3) ARM64 must receive the same runtime contract as Docker integration.
          arm_path = ".github/workflows/arm64-validation.yml"
          arm = read(arm_path)
          arm = arm.replace(
              '''    runs-on: ubuntu-24.04-arm\n    timeout-minutes: 90\n\n    steps:''',
              '''    runs-on: ubuntu-24.04-arm\n    timeout-minutes: 90\n    env:\n      POSTGRES_DB: aalie_ci\n      POSTGRES_USER: aalie_ci\n      POSTGRES_PASSWORD: aalie_ci_password\n      API_DATABASE_URL: postgresql+psycopg://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci\n      WEB_DATABASE_URL: postgresql://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci\n      BETTER_AUTH_URL: http://localhost:3000\n      BETTER_AUTH_SECRET: ci-only-not-a-secret\n      GOOGLE_CLIENT_ID: ci-client-id\n      GOOGLE_CLIENT_SECRET: ci-client-secret\n      AUTH_JWT_ISSUER: http://localhost:3000\n      AUTH_JWT_AUDIENCE: urn:aalie:api\n      AUTH_JWKS_URL: http://web:3000/api/auth/jwks\n\n    steps:''',
              1,
          )
          arm = arm.replace(
              '''  pull_request:\n    branches: [main]\n''',
              '''  pull_request:\n    types: [opened, synchronize, reopened, ready_for_review]\n    branches: [main]\n''',
              1,
          )
          write(arm_path, arm)

          # 4) Keep web unit tests permanently in the blocking CI contract and
          # allow a ready-for-review event to validate the final authored commit.
          ci_path = ".github/workflows/ci.yaml"
          ci = read(ci_path)
          ci = ci.replace(
              '''  pull_request:\n    branches: [main, develop]\n''',
              '''  pull_request:\n    types: [opened, synchronize, reopened, ready_for_review]\n    branches: [main, develop]\n''',
              1,
          )
          ci = ci.replace(
              '''      - name: Build web app\n        run: pnpm -C apps/web build\n\n      # Python setup y smoke test''',
              '''      - name: Build web app\n        run: pnpm -C apps/web build\n\n      - name: Test web app\n        run: pnpm -C apps/web test\n\n      # Python setup y smoke test''',
              1,
          )
          write(ci_path, ci)

          # 5) Privacy must match the new optional Google identity flow. Core
          # AALIE remains usable anonymously and quiz progress remains local.
          translations = {
              "es": {
                  "last": "Última actualización: agosto de 2026",
                  "body": "AALIE es una plataforma educativa para aprender y practicar análisis de algoritmos. Sus funciones principales pueden utilizarse sin crear una cuenta. Si eliges iniciar sesión con Google, AALIE procesa los datos básicos de identidad necesarios para crear y mantener tu cuenta. Las funciones opcionales de IA se mantienen separadas y pueden implicar el envío de contexto adicional al proveedor configurado.",
                  "account_title": "La cuenta es opcional",
                  "account_desc": "Puedes usar las funciones principales sin iniciar sesión. Si eliges Google, AALIE crea una cuenta y almacena los datos básicos de identidad entregados para autenticarte, como nombre, correo electrónico, imagen de perfil si está disponible, estado de verificación e identificadores técnicos de cuenta.",
                  "profile": "Si inicias sesión con Google: nombre, correo electrónico, imagen de perfil si está disponible, estado de verificación e identificadores de cuenta y proveedor necesarios para asociar tu identidad.",
                  "session": "Datos técnicos de sesión necesarios para autenticación y seguridad, que pueden incluir dirección IP y agente de usuario.",
                  "provider1": "Google se utiliza únicamente como proveedor opcional de identidad. El inicio de sesión usa los permisos básicos de identidad del proveedor; AALIE no solicita acceso a Gmail, Drive, Calendar ni otros productos de Google.",
                  "provider2": "Para mantener la cuenta y la sesión, AALIE almacena en PostgreSQL datos básicos del usuario y registros técnicos de autenticación. Cuando Better Auth persiste credenciales OAuth devueltas por Google, AALIE configura su cifrado antes de almacenarlas.",
                  "provider3": "Los datos obtenidos mediante Google no se venden, no se utilizan para publicidad y no se envían a un proveedor de IA por el solo hecho de iniciar sesión. Iniciar sesión tampoco constituye consentimiento para participar en investigación.",
                  "rights3": "Las funciones principales pueden utilizarse sin cuenta y, en esta fase, el progreso de quizzes continúa almacenándose localmente en el navegador. Puedes borrar esos datos desde el navegador. Para datos asociados a una cuenta creada con Google, puedes contactar al equipo para ejercer las solicitudes aplicables de acceso, corrección o eliminación.",
                  "changes1": "Podemos actualizar esta política cuando cambien las funciones de AALIE, especialmente si se agregan analíticas, sincronización de progreso, nuevos proveedores de IA, nuevas formas de exportación, integraciones institucionales o cambios en el manejo de API keys y datos de autenticación.",
                  "benefit1_title": "Identidad persistente",
                  "benefit1_desc": "Usa la misma cuenta de Google para identificarte en AALIE cuando decidas iniciar sesión.",
                  "benefit2_title": "Perfil de usuario",
                  "benefit2_desc": "Consulta tu identidad y rol de AALIE sin convertir el inicio de sesión en un requisito para analizar.",
              },
              "en": {
                  "last": "Last updated: August 2026",
                  "body": "AALIE is an educational platform for learning and practicing algorithm analysis. Its core features can be used without creating an account. If you choose to sign in with Google, AALIE processes the basic identity data needed to create and maintain your account. Optional AI features remain separate and may send additional context to the configured provider.",
                  "account_title": "The account is optional",
                  "account_desc": "You can use the core features without signing in. If you choose Google, AALIE creates an account and stores the basic identity data provided for authentication, such as name, email address, profile image when available, verification status, and technical account identifiers.",
                  "profile": "If you sign in with Google: name, email address, profile image when available, verification status, and account/provider identifiers needed to associate your identity.",
                  "session": "Technical session data needed for authentication and security, which may include IP address and user agent.",
                  "provider1": "Google is used only as an optional identity provider. Sign-in uses the provider's basic identity permissions; AALIE does not request access to Gmail, Drive, Calendar, or other Google products.",
                  "provider2": "To maintain the account and session, AALIE stores basic user data and technical authentication records in PostgreSQL. When Better Auth persists OAuth credentials returned by Google, AALIE configures them to be encrypted before storage.",
                  "provider3": "Data obtained through Google is not sold, is not used for advertising, and is not sent to an AI provider merely because you signed in. Signing in also does not constitute consent to participate in research.",
                  "rights3": "Core features can be used without an account and, at this stage, quiz progress continues to be stored locally in the browser. You can delete that data from the browser. For data associated with a Google-created account, you can contact the team to make applicable access, correction, or deletion requests.",
                  "changes1": "We may update this policy when AALIE changes, especially if analytics, progress synchronization, new AI providers, new export formats, institutional integrations, or changes to API-key and authentication-data handling are introduced.",
                  "benefit1_title": "Persistent identity",
                  "benefit1_desc": "Use the same Google account to identify yourself in AALIE whenever you choose to sign in.",
                  "benefit2_title": "User profile",
                  "benefit2_desc": "View your AALIE identity and role without making sign-in a requirement for analysis.",
              },
          }
          for locale, text in translations.items():
              path = Path(f"apps/web/messages/{locale}.json")
              data = json.loads(path.read_text(encoding="utf-8"))
              privacy = data["privacy"]
              privacy["hero"]["lastUpdated"] = text["last"]
              privacy["hero"]["body"] = text["body"]
              privacy["summary"]["items"]["account"]["title"] = text["account_title"]
              privacy["summary"]["items"]["account"]["description"] = text["account_desc"]
              privacy["sections"]["provided"]["items"]["accountProfile"] = text["profile"]
              privacy["sections"]["provided"]["items"]["sessionTechnical"] = text["session"]
              privacy["sections"]["providers"]["paragraph1"] = text["provider1"]
              privacy["sections"]["providers"]["paragraph2"] = text["provider2"]
              privacy["sections"]["providers"]["paragraph3"] = text["provider3"]
              privacy["sections"]["rights"]["paragraph3"] = text["rights3"]
              privacy["sections"]["changes"]["paragraph1"] = text["changes1"]
              benefits = data.get("auth", {}).get("benefits", {})
              if "limit" in benefits:
                  benefits["limit"]["title"] = text["benefit1_title"]
                  benefits["limit"]["description"] = text["benefit1_desc"]
              if "progress" in benefits:
                  benefits["progress"]["title"] = text["benefit2_title"]
                  benefits["progress"]["description"] = text["benefit2_desc"]
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "apps/web/src/app/[locale]/privacy/page.tsx",
              '''    "questions",\n    "context",\n    "key",''',
              '''    "questions",\n    "context",\n    "accountProfile",\n    "sessionTechnical",\n    "key",''',
          )

          # 6) Production bootstrap must contain every runtime variable required
          # by Compose before the first auth-enabled deployment.
          prod_path = "docs/06-operations/production-oci.md"
          prod = read(prod_path)
          old = '''DB_PASSWORD="$(openssl rand -hex 32)"\numask 077\ncat > .env.runtime <<EOF\nPOSTGRES_DB=aalie\nPOSTGRES_USER=aalie\nPOSTGRES_PASSWORD=${DB_PASSWORD}\nAPI_DATABASE_URL=postgresql+psycopg://aalie:${DB_PASSWORD}@postgres:5432/aalie\nWEB_DATABASE_URL=postgresql://aalie:${DB_PASSWORD}@postgres:5432/aalie\nEOF\nunset DB_PASSWORD'''
          new = '''DB_PASSWORD="$(openssl rand -hex 32)"\nBETTER_AUTH_SECRET="$(openssl rand -hex 32)"\numask 077\ncat > .env.runtime <<EOF\nPOSTGRES_DB=aalie\nPOSTGRES_USER=aalie\nPOSTGRES_PASSWORD=${DB_PASSWORD}\nAPI_DATABASE_URL=postgresql+psycopg://aalie:${DB_PASSWORD}@postgres:5432/aalie\nWEB_DATABASE_URL=postgresql://aalie:${DB_PASSWORD}@postgres:5432/aalie\nBETTER_AUTH_URL=https://aalie.dev\nBETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}\nGOOGLE_CLIENT_ID=<GOOGLE_CLIENT_ID>\nGOOGLE_CLIENT_SECRET=<GOOGLE_CLIENT_SECRET>\nAUTH_JWT_ISSUER=https://aalie.dev\nAUTH_JWT_AUDIENCE=urn:aalie:api\nAUTH_JWKS_URL=http://web:3000/api/auth/jwks\nEOF\nunset DB_PASSWORD BETTER_AUTH_SECRET'''
          if old not in prod:
              raise RuntimeError("Canonical OCI runtime bootstrap block changed unexpectedly")
          prod = prod.replace(old, new, 1)
          oauth_note = '''\n### 8.1 Configurar Google OAuth antes del primer arranque con autenticación\n\nConfigure en Google Cloud un cliente OAuth 2.0 de tipo **Web application**. Para producción use `https://aalie.dev` como origen autorizado y `https://aalie.dev/api/auth/callback/google` como redirect URI. Para desarrollo local use `http://localhost:3000` y `http://localhost:3000/api/auth/callback/google`. AALIE usa únicamente identidad básica; no habilite permisos de Gmail, Drive o Calendar.\n\nSustituya `<GOOGLE_CLIENT_ID>` y `<GOOGLE_CLIENT_SECRET>` en `.env.runtime` por las credenciales reales y conserve el archivo en modo `0600`. `GOOGLE_CLIENT_SECRET` y `BETTER_AUTH_SECRET` son secretos y nunca se versionan. Antes del primer deploy auth-enabled compruebe que no quedan placeholders:\n\n```bash\n! grep -q '<GOOGLE_' /home/ubuntu/aalie/.env.runtime\n```\n\nEl comando debe devolver código 0. Las funciones principales de AALIE siguen siendo anónimas, pero la configuración de Better Auth es obligatoria para que el contenedor web actual arranque.\n\n'''
          marker = "## 9. Primer pull y primer arranque\n"
          if marker not in prod:
              raise RuntimeError("OCI section 9 marker missing")
          prod = prod.replace(marker, oauth_note + marker, 1)
          write(prod_path, prod)

          print("Audited corrections applied; Better Auth remains pinned at 1.7.1")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format audited frontend files
        run: |
          pnpm -C apps/web exec prettier --write \
            'src/app/[locale]/terms/page.tsx' \
            'src/app/[locale]/privacy/page.tsx' \
            'src/components/HealthStatus.tsx' \
            'src/components/LocaleSwitcher.tsx' \
            'messages/es.json' \
            'messages/en.json'

      - name: Build, lint and test web
        run: |
          pnpm -C packages/types build
          pnpm -C packages/grammar build
          pnpm -C apps/web lint
          pnpm -C apps/web test
          pnpm -C apps/web build
          pnpm audit --prod --audit-level high

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "apps/api/requirements*.txt"

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-xdist

      - name: Install grammar and validate API
        run: |
          pip install -e packages/grammar/py
          python -m ruff check apps/api --output-format=github
          cd apps/api
          alembic upgrade head
          pytest tests/ -v --tb=short -n auto --dist=worksteal -m "fast or oracle" --cov=app --cov-report=term --cov-fail-under=70
          pytest tests/ -v --tb=short -n auto --dist=worksteal -m "contract or system"

      - name: Validate repository contracts
        run: |
          python3 scripts/check_docs_contracts.py
          python apps/api/scripts/validate_quiz_bank.py
          python apps/api/scripts/report_quiz_bank_coverage.py --fail-on-critical
          AALIE_TAG=0000000000000000000000000000000000000000 docker compose -f infra/oci/compose.yml config --quiet
          docker compose -f infra/compose.prod.yml config --quiet
          bash -n infra/oci/deploy/aalie-deploy
          bash -n infra/oci/scripts/host-health.sh
          bash -n infra/oci/scripts/postgres-backup.sh
          bash -n infra/oci/scripts/postgres-restore.sh
          bash -n infra/oci/scripts/postgres-runtime-smoke.sh
          bash -n infra/oci/scripts/promote-admin.sh

      - name: Commit validated corrections
        shell: bash
        run: |
          git config user.name "Cruz1122"
          git config user.email "juan.cruz37552@ucaldas.edu.co"
          git rm -- .github/workflows/db-postgresql-corrections.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(auth): close PostgreSQL OAuth quality gaps"
          git push origin HEAD:db/postgresql-init
