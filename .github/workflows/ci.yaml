name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, develop, ci-test]
    paths:
      - "apps/**"
      - "docs/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - "pnpm-*.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "docs/**"
      - "packages/**"
      - "infra/**"
      - "scripts/**"
      - "pnpm-*.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yaml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job principal: Build crítico (debe pasar)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
            version: 9.15.0
            run_install: false

      - name: Setup Node.js (22.x) + Cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages en orden correcto
      - name: Build @aa/types
        run: pnpm -C packages/types build

      - name: Build @aa/grammar
        run: |
          if [ -f packages/grammar/package.json ]; then
            if pnpm -C packages/grammar run --help | grep -q "build"; then
              pnpm -C packages/grammar build
            else
              echo "No build script in @aa/grammar, using existing files"
            fi
          fi

      # Build crítico de web (debe pasar)
      - name: Build web app
        run: pnpm -C apps/web build

      # Python setup y smoke test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements*.txt"

      - name: Install FastAPI dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          fi

      - name: FastAPI smoke test
        run: python -c "import fastapi; print('✅ FastAPI:', fastapi.__version__)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements*.txt"

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install grammar package
        run: |
          if [ -d packages/grammar/py ]; then
            echo "📦 Installing grammar package..."
            pip install -e packages/grammar/py
          else
            echo "⚠️  Grammar package not found, tests may fail"
          fi

      - name: Run tests with coverage
        working-directory: apps/api
        run: |
          echo "🧪 Running fast tests with coverage (excluding slow suite)..."
          pytest tests/ -v --tb=short -n auto --dist=worksteal -m "not slow" --cov=app --cov-report=xml --cov-report=term --cov-report=html --cov-fail-under=70

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/htmlcov/
          if-no-files-found: ignore
          retention-days: 30

      - name: Test summary
        if: always()
        run: |
          echo "✅ Tests completed"
          echo "📊 Coverage report available in artifacts"

  lint-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
            version: 9.15.0
            run_install: false

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies for linting
        run: |
          pnpm -C packages/types build
          if [ -f packages/grammar/package.json ]; then
            if pnpm -C packages/grammar run --help | grep -q "build"; then
              pnpm -C packages/grammar build
            fi
          fi

      - name: ESLint (web)
        run: pnpm -C apps/web lint

      - name: Prettier (web)  
        run: pnpm -C apps/web format

  lint-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements*.txt"

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Ruff linting (api)
        run: python -m ruff check apps/api --output-format=github

      - name: Black formatting (api)
        run: python -m black --check --diff apps/api mcp packages/grammar/py

  docs-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate docs contracts
        run: python3 scripts/check_docs_contracts.py

  # Job de Docker: Verifica que las imágenes construyen
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test, lint-web, lint-api, docs-contracts]  # Solo corre si build, tests, lint y docs pasan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test API Docker build
        run: |
          if [ -f apps/api/Dockerfile ]; then
            echo "🐳 Testing API Docker build..."
            docker build -f apps/api/Dockerfile -t test-api .
            echo "✅ API Docker build successful"
          else
            echo "ℹ️  No API Dockerfile found"
          fi

      - name: Test docker-compose config
        run: |
          if [ -f infra/docker-compose.yml ]; then
            echo "🐳 Testing docker-compose config..."
            docker compose -f infra/docker-compose.yml config
            echo "✅ docker-compose config valid"
          else
            echo "ℹ️  No docker-compose.yml found"
          fi

      - name: Cleanup
        run: docker image prune -f
