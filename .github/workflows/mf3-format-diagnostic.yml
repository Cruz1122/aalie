name: MF3 format diagnostic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: mf3-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier-apply:
    name: Apply exact Prettier formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format exact MF3 web files
        run: |
          pnpm -C apps/web exec prettier --write \
            src/components/research/ResearchAdminClient.tsx \
            src/lib/bff/__tests__/bff-proxy-gate.test.ts \
            src/lib/bff/__tests__/bff-rate-limit.test.ts
          git diff --check
      - name: Commit exact formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/web/src/components/research/ResearchAdminClient.tsx \
            apps/web/src/lib/bff/__tests__/bff-proxy-gate.test.ts \
            apps/web/src/lib/bff/__tests__/bff-rate-limit.test.ts; then
            echo "Formatting already canonical"
            exit 0
          fi
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -- \
            apps/web/src/components/research/ResearchAdminClient.tsx \
            apps/web/src/lib/bff/__tests__/bff-proxy-gate.test.ts \
            apps/web/src/lib/bff/__tests__/bff-rate-limit.test.ts
          git commit -m "style(web): apply canonical MF3 formatting" -m "Co-authored-by: Cruz1122 <juan.cruz37552@ucaldas.edu.co>"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
