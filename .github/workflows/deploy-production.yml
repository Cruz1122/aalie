name: Deploy production

on:
  workflow_run:
    workflows: ["ARM64 validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aalie-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: "Production – aalie"
      url: https://aalie.dev

    steps:
      - name: Checkout smoke contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aalie-production
          chmod 600 ~/.ssh/aalie-production
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact commit to OCI
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/aalie-production \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            ubuntu@aalie.dev \
            "deploy ${RELEASE_SHA}"

      - name: Complete public production smoke
        shell: bash
        env:
          AALIE_BASE_URL: https://aalie.dev
          AALIE_API_URL: ""
        run: python3 scripts/smoke_prod.py
