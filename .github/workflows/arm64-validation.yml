name: ARM64 validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  API_IMAGE: aalie-api:prod
  WEB_IMAGE: aalie-web:prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/compose.prod.yml"
      - "infra/oci/**"
      - "scripts/smoke_prod.py"
      - "apps/api/uv.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/arm64-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/compose.prod.yml"
      - "infra/oci/**"
      - "scripts/smoke_prod.py"
      - "apps/api/uv.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/arm64-validation.yml"

concurrency:
  group: arm64-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-validation:
    permissions:
      contents: read
      packages: write
    name: ARM64 native build and production smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      POSTGRES_DB: aalie_ci
      POSTGRES_USER: aalie_ci
      POSTGRES_PASSWORD: aalie_ci_password
      API_DATABASE_URL: postgresql+psycopg://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci
      WEB_DATABASE_URL: postgresql://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-not-a-secret
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      AUTH_JWT_ISSUER: http://localhost:3000
      AUTH_JWT_AUDIENCE: urn:aalie:api
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record native ARM64 environment
        run: |
          echo "Host architecture: $(uname -m)"
          echo "Docker: $(docker version --format '{{.Server.Version}}')"
          echo "Buildx: $(docker buildx version)"
          docker info --format 'Docker architecture: {{.Architecture}}; OS: {{.OSType}}'

      - name: Validate OCI deployment contracts
        env:
          AALIE_TAG: "0000000000000000000000000000000000000000"
        run: |
          docker compose --file infra/oci/compose.yml config --quiet
          docker compose --file infra/oci/compose.yml config --format json > /tmp/aalie-oci-compose.json
          python3 - <<'PY'
          import json

          with open("/tmp/aalie-oci-compose.json", encoding="utf-8") as stream:
              config = json.load(stream)

          services = config["services"]
          postgres = services["postgres"]
          assert postgres["image"] == "postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296"
          assert not postgres.get("ports"), "PostgreSQL must not publish port 5432"
          assert postgres["volumes"][0]["target"] == "/var/lib/postgresql"
          assert postgres["healthcheck"]["test"][0] == "CMD-SHELL"
          assert "pg_isready" in postgres["healthcheck"]["test"][1]
          assert services["api"]["depends_on"]["postgres"]["condition"] == "service_healthy"
          assert services["api"]["environment"]["DATABASE_URL"].startswith("postgresql+psycopg://")
          assert services["web"]["environment"]["DATABASE_URL"].startswith("postgresql://")
          assert "NEXT_PUBLIC_DATABASE_URL" not in services["web"].get("environment", {})
          for name in ("BETTER_AUTH_URL", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "AUTH_JWT_ISSUER", "AUTH_JWT_AUDIENCE"):
              assert name in services["web"]["environment"]
          for name in ("AUTH_JWKS_URL", "AUTH_JWT_ISSUER", "AUTH_JWT_AUDIENCE"):
              assert name in services["api"]["environment"]
          assert not any(name.startswith("NEXT_PUBLIC_") and "GOOGLE" in name for name in services["web"]["environment"])
          assert not services["api"].get("ports"), "API must not publish port 8000"
          assert not services["web"].get("ports"), "Web must not publish port 3000"
          published = {
              (int(port["published"]), int(port["target"]))
              for port in services["caddy"].get("ports", [])
          }
          assert published == {(80, 80), (443, 443)}, published
          PY
          bash -n infra/oci/deploy/aalie-deploy
          bash -n infra/oci/scripts/host-health.sh
          bash -n infra/oci/scripts/postgres-backup.sh
          bash -n infra/oci/scripts/postgres-restore.sh
          bash -n infra/oci/scripts/postgres-runtime-smoke.sh
          bash -n infra/oci/scripts/promote-admin.sh
          docker run --rm \
            -v "$PWD/infra/oci/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build API production image natively
        run: |
          docker build \
            --target prod \
            --tag "$API_IMAGE" \
            --file apps/api/Dockerfile \
            .

      - name: Build web production image natively
        run: |
          docker build \
            --target runner \
            --tag "$WEB_IMAGE" \
            --file apps/web/Dockerfile \
            .

      - name: Verify image architecture
        run: |
          test "$(docker image inspect "$API_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/arm64"
          docker image inspect "$API_IMAGE" --format 'API: {{.Os}}/{{.Architecture}}; size={{.Size}} bytes'
          docker image inspect "$WEB_IMAGE" --format 'Web: {{.Os}}/{{.Architecture}}; size={{.Size}} bytes'

      - name: Migrate and start production Compose stack
        run: |
          docker compose --file infra/compose.prod.yml up --detach --wait postgres
          docker compose --file infra/compose.prod.yml run --rm --no-deps api alembic upgrade head
          docker compose --file infra/compose.prod.yml up --detach --wait

      - name: Verify ARM64 runtime and non-root users
        run: |
          docker compose --file infra/compose.prod.yml exec --no-TTY api sh -c 'uname -m; python --version; python -c "import platform; print(platform.machine())"; pdflatex --version | sed -n "1p"; id -un'
          docker compose --file infra/compose.prod.yml exec --no-TTY web sh -c 'uname -m; node --version; id -un'
          docker compose --file infra/compose.prod.yml exec --no-TTY postgres sh -c 'uname -m; postgres --version; id -un'
          docker compose --file infra/compose.prod.yml exec --no-TTY web node -e "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

      - name: Validate PostgreSQL persistence and restore on ARM64
        run: |
          mkdir -p /tmp/aalie-arm64-backups
          printf '%s\n' 'AALIE_TAG=0000000000000000000000000000000000000000' > /tmp/aalie-arm64-tag.env
          printf '%s\n' 'POSTGRES_DB=aalie_ci' 'POSTGRES_USER=aalie_ci' 'POSTGRES_PASSWORD=aalie_ci_password' 'API_DATABASE_URL=postgresql+psycopg://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci' 'WEB_DATABASE_URL=postgresql://aalie_ci:aalie_ci_password@postgres:5432/aalie_ci' 'BETTER_AUTH_URL=http://localhost:3000' 'BETTER_AUTH_SECRET=ci-only-not-a-secret' 'GOOGLE_CLIENT_ID=ci-client-id' 'GOOGLE_CLIENT_SECRET=ci-client-secret' 'AUTH_JWT_ISSUER=http://localhost:3000' 'AUTH_JWT_AUDIENCE=urn:aalie:api' 'AUTH_JWKS_URL=http://web:3000/api/auth/jwks' > /tmp/aalie-arm64-runtime.env
          chmod 600 /tmp/aalie-arm64-tag.env /tmp/aalie-arm64-runtime.env
          APP_DIR=/tmp COMPOSE_FILE="$GITHUB_WORKSPACE/infra/compose.prod.yml" ENV_FILE=/tmp/aalie-arm64-tag.env RUNTIME_ENV_FILE=/tmp/aalie-arm64-runtime.env bash infra/oci/scripts/postgres-runtime-smoke.sh /tmp/aalie-arm64-backups/aalie.dump

      - name: Run complete production smoke
        run: python3 scripts/smoke_prod.py

      - name: Log in to GHCR
        if: success() && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API ARM64
        if: success() && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cruz1122/aalie-api:latest-arm64
            ghcr.io/cruz1122/aalie-api:${{ github.sha }}

      - name: Build and push Web ARM64
        if: success() && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/cruz1122/aalie-web:latest-arm64
            ghcr.io/cruz1122/aalie-web:${{ github.sha }}

      - name: Validate shutdown with SIGTERM
        if: always()
        run: docker compose --file infra/compose.prod.yml kill --signal SIGTERM web api || true

      - name: Collect service logs
        if: always()
        run: docker compose --file infra/compose.prod.yml logs --no-color

      - name: Clean up stack
        if: always()
        run: docker compose --file infra/compose.prod.yml down --remove-orphans

  deploy-production:
    name: Deploy production
    needs: arm64-validation
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: "Production – aalie"
      url: https://aalie.dev

    concurrency:
      group: aalie-production
      cancel-in-progress: false

    steps:
      - name: Checkout smoke contract
        uses: actions/checkout@v4

      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/aalie-production

          chmod 600 ~/.ssh/aalie-production

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact commit to OCI
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/aalie-production \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            ubuntu@aalie.dev \
            "deploy ${GITHUB_SHA}"

      - name: Complete public production smoke
        shell: bash
        env:
          AALIE_BASE_URL: https://aalie.dev
          AALIE_API_URL: ""
        run: python3 scripts/smoke_prod.py