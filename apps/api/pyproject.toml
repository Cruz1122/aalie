[project]
name = "algorithmic-analysis-api"
version = "0.1.0"
description = "API FastAPI para análisis de algoritmos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "antlr4-python3-runtime==4.13.2",
    "python-dotenv>=1.0.0",
    "sympy>=1.12,<2.0",
    "reportlab>=4.2,<5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # import sorting
ignore = ["E501"]      # dejamos el ancho a Black

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short"
]
markers = [
    "fast: fast lane tests for PR feedback",
    "oracle: semantic oracle tests (real expected output)",
    "unit: unit tests (fast, isolated)",
    "component: component/integration tests (few canonical algorithms)",
    "contract: contract/regression tests (many parametrized cases)",
    "system: system/HTTP endpoint tests",
    "slow: slow tests (e.g. heavy SymPy)",
    "stress: stress/integration heavy tests",
    "export: export contract/integration tests",
    "trace: trace/structured-trace tests",
    "iterative: tests involving iterative analysis",
    "while_loop: tests involving while-loop analysis",
    "while: tests involving WHILE loops",
    "while_domain: tests del dominio WHILE (engine, patrones, metamórficos)",
    "recursive: tests involving recursive analysis",
    "dp: tests involving DP algorithms",
    "benchmark: performance/regression benchmark tests",
]
