services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    container_name: aalie-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-prod-data:/var/lib/postgresql

  api:
    image: aalie-api:prod
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: aalie-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CORS_ENABLED: "0"
      API_INTERNAL_BASE_URL: "http://api:8000"
      QUIZ_DATA_DIR: "/usr/src/app/packages/content-data/quizzes"
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?AUTH_JWKS_URL is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      AALIE_BUILD_SHA: ${AALIE_BUILD_SHA:-local}
      AALIE_STUDY_TELEMETRY_ENABLED: ${AALIE_STUDY_TELEMETRY_ENABLED:-false}
      PDF_EXPORT_MAX_CONCURRENCY: ${PDF_EXPORT_MAX_CONCURRENCY:-1}
      AALIE_RATE_LIMIT_PARSE_ANON: ${AALIE_RATE_LIMIT_PARSE_ANON:-120}
      AALIE_RATE_LIMIT_PARSE_AUTH: ${AALIE_RATE_LIMIT_PARSE_AUTH:-300}
      AALIE_RATE_LIMIT_ANALYSIS_ANON: ${AALIE_RATE_LIMIT_ANALYSIS_ANON:-30}
      AALIE_RATE_LIMIT_ANALYSIS_AUTH: ${AALIE_RATE_LIMIT_ANALYSIS_AUTH:-120}
      AALIE_RATE_LIMIT_TRACE_ANON: ${AALIE_RATE_LIMIT_TRACE_ANON:-10}
      AALIE_RATE_LIMIT_TRACE_AUTH: ${AALIE_RATE_LIMIT_TRACE_AUTH:-40}
      AALIE_RATE_LIMIT_QUIZ_ANON: ${AALIE_RATE_LIMIT_QUIZ_ANON:-20}
      AALIE_RATE_LIMIT_QUIZ_AUTH: ${AALIE_RATE_LIMIT_QUIZ_AUTH:-60}
      AALIE_RATE_LIMIT_EXPORT_TEXT_ANON: ${AALIE_RATE_LIMIT_EXPORT_TEXT_ANON:-10}
      AALIE_RATE_LIMIT_EXPORT_TEXT_AUTH: ${AALIE_RATE_LIMIT_EXPORT_TEXT_AUTH:-30}
      AALIE_RATE_LIMIT_EXPORT_PDF_ANON: ${AALIE_RATE_LIMIT_EXPORT_PDF_ANON:-2}
      AALIE_RATE_LIMIT_EXPORT_PDF_AUTH: ${AALIE_RATE_LIMIT_EXPORT_PDF_AUTH:-8}
      AALIE_RATE_LIMIT_LLM_ANON: ${AALIE_RATE_LIMIT_LLM_ANON:-5}
      AALIE_RATE_LIMIT_LLM_AUTH: ${AALIE_RATE_LIMIT_LLM_AUTH:-20}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: aalie-web:prod
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: aalie-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_INTERNAL_BASE_URL: "http://api:8000"
      DATABASE_URL: ${WEB_DATABASE_URL:?WEB_DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      # GitHub Actions gets an ephemeral test-only key from GITHUB_RUN_ID; outside Actions the dedicated secret remains mandatory.
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:-ci-${GITHUB_RUN_ID:?RATE_LIMIT_HMAC_SECRET is required outside GitHub Actions}}
      AALIE_RATE_LIMITS_ENABLED: ${AALIE_RATE_LIMITS_ENABLED:-true}
      AALIE_RATE_LIMIT_PARSE_ANON: ${AALIE_RATE_LIMIT_PARSE_ANON:-120}
      AALIE_RATE_LIMIT_PARSE_AUTH: ${AALIE_RATE_LIMIT_PARSE_AUTH:-300}
      AALIE_RATE_LIMIT_ANALYSIS_ANON: ${AALIE_RATE_LIMIT_ANALYSIS_ANON:-30}
      AALIE_RATE_LIMIT_ANALYSIS_AUTH: ${AALIE_RATE_LIMIT_ANALYSIS_AUTH:-120}
      AALIE_RATE_LIMIT_TRACE_ANON: ${AALIE_RATE_LIMIT_TRACE_ANON:-10}
      AALIE_RATE_LIMIT_TRACE_AUTH: ${AALIE_RATE_LIMIT_TRACE_AUTH:-40}
      AALIE_RATE_LIMIT_QUIZ_ANON: ${AALIE_RATE_LIMIT_QUIZ_ANON:-20}
      AALIE_RATE_LIMIT_QUIZ_AUTH: ${AALIE_RATE_LIMIT_QUIZ_AUTH:-60}
      AALIE_RATE_LIMIT_EXPORT_TEXT_ANON: ${AALIE_RATE_LIMIT_EXPORT_TEXT_ANON:-10}
      AALIE_RATE_LIMIT_EXPORT_TEXT_AUTH: ${AALIE_RATE_LIMIT_EXPORT_TEXT_AUTH:-30}
      AALIE_RATE_LIMIT_EXPORT_PDF_ANON: ${AALIE_RATE_LIMIT_EXPORT_PDF_ANON:-2}
      AALIE_RATE_LIMIT_EXPORT_PDF_AUTH: ${AALIE_RATE_LIMIT_EXPORT_PDF_AUTH:-8}
      AALIE_RATE_LIMIT_LLM_ANON: ${AALIE_RATE_LIMIT_LLM_ANON:-5}
      AALIE_RATE_LIMIT_LLM_AUTH: ${AALIE_RATE_LIMIT_LLM_AUTH:-20}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-prod-data:
