services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    container_name: algoritmos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aalie}
      POSTGRES_USER: ${POSTGRES_USER:-aalie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aalie-local-only}
    expose:
      - "5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-dev-data:/var/lib/postgresql

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: algoritmos-api
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "until getent hosts postgres >/dev/null 2>&1; do
             echo 'Waiting for Docker DNS to resolve postgres...';
             sleep 1;
           done &&
           alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - path: ../apps/api/.env.example
    environment:
      DEV_CORS_ENABLED: "1"
      DEV_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # LLM values are interpolated by Compose from the project .env or from
      # an explicit --env-file. Keep secrets out of env_file defaults.
      API_KEY: ${API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_COMPATIBLE_ENDPOINT_BASE: ${OPENAI_COMPATIBLE_ENDPOINT_BASE:-https://api.openai.com/v1/chat/completions}
      OPENROUTER_ENDPOINT_BASE: ${OPENROUTER_ENDPOINT_BASE:-https://openrouter.ai/api/v1/chat/completions}
      XAI_ENDPOINT_BASE: ${XAI_ENDPOINT_BASE:-https://api.x.ai/v1/chat/completions}
      GROQ_ENDPOINT_BASE: ${GROQ_ENDPOINT_BASE:-https://api.groq.com/openai/v1/chat/completions}
      ANTHROPIC_ENDPOINT_BASE: ${ANTHROPIC_ENDPOINT_BASE:-https://api.anthropic.com/v1/messages}
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://aalie:aalie-local-only@postgres:5432/aalie}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:3000/api/auth/jwks}
      # The development stack must not inherit the production OAuth issuer
      # from the repository-level .env file.
      AUTH_JWT_ISSUER: ${DEV_AUTH_JWT_ISSUER:-http://localhost:3000}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-urn:aalie:api}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:?RATE_LIMIT_HMAC_SECRET is required}
      AALIE_RATE_LIMIT_SERVICE_TOKEN: ${AALIE_RATE_LIMIT_SERVICE_TOKEN:-}
      AALIE_RATE_LIMIT_LLM_UCALDAS_AUTH: ${AALIE_RATE_LIMIT_LLM_UCALDAS_AUTH:-5}
      AALIE_RATE_LIMIT_LLM_BACKEND_AUTH: ${AALIE_RATE_LIMIT_LLM_BACKEND_AUTH:-5}
      AALIE_ABUSE_STRIKES_TO_BAN: ${AALIE_ABUSE_STRIKES_TO_BAN:-3}
      AALIE_ABUSE_STRIKE_WINDOW_SECONDS: ${AALIE_ABUSE_STRIKE_WINDOW_SECONDS:-300}
      AALIE_ABUSE_BAN_SECONDS: ${AALIE_ABUSE_BAN_SECONDS:-3600}
    volumes:
      # Monta solo el código de la API para recarga en caliente
      - ../apps/api:/usr/src/app/apps/api
      # Monta packages para acceso a parsers grammar
      - ../packages:/usr/src/app/packages

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: algoritmos-web
    depends_on:
      - api
    working_dir: /usr/src/app
    command: >
      sh -c "pnpm install -w --frozen-lockfile &&
             pnpm --filter web dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - path: ../apps/web/.env.example
      - path: ../apps/web/.env
        required: false
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000" # para futuras llamadas cliente
      API_INTERNAL_BASE_URL: "http://api:8000" # usado por /api/health (SSR/proxy)
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://aalie:aalie-local-only@postgres:5432/aalie}
      # Better Auth/BFF: these values live in the root .env and must be
      # explicitly forwarded to the server-side Next.js container.
      # Better Auth validates callbackURL against this public local origin.
      # Production keeps using BETTER_AUTH_URL in compose.prod.yml/OCI.
      BETTER_AUTH_URL: ${DEV_BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      AUTH_JWT_ISSUER: ${DEV_AUTH_JWT_ISSUER:-http://localhost:3000}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:?RATE_LIMIT_HMAC_SECRET is required}
      AALIE_RATE_LIMIT_SERVICE_TOKEN: ${AALIE_RATE_LIMIT_SERVICE_TOKEN:-}
      AALIE_RATE_LIMITS_ENABLED: ${AALIE_RATE_LIMITS_ENABLED:-true}
      AALIE_RATE_LIMIT_LLM_UCALDAS_AUTH: ${AALIE_RATE_LIMIT_LLM_UCALDAS_AUTH:-5}
      WATCHPACK_POLLING: "true"
      # Configuración LLM                       # LOCAL para LM Studio, REMOTE para GitHub Models
      LM_STUDIO_ENDPOINT: "http://host.docker.internal:1234/v1" # Acceso al host desde Docker
      LM_STUDIO_API_KEY: "lm-studio" # Token de GitHub para modo REMOTE
    volumes:
      # Código con hot-reload
      - ../apps/web:/usr/src/app/apps/web
      - ../packages:/usr/src/app/packages
      # Volúmenes para node_modules (no los pises con el bind mount)
      - web_root_node_modules:/usr/src/app/node_modules
      - web_pkg_node_modules:/usr/src/app/apps/web/node_modules
      - web_content_catalog_node_modules:/usr/src/app/packages/content-catalog/node_modules
      - web_grammar_node_modules:/usr/src/app/packages/grammar/node_modules
      - web_types_node_modules:/usr/src/app/packages/types/node_modules
      - web_next_cache:/usr/src/app/apps/web/.next

volumes:
  postgres-dev-data:
  web_root_node_modules:
  web_pkg_node_modules:
  web_content_catalog_node_modules:
  web_grammar_node_modules:
  web_types_node_modules:
  web_next_cache:
