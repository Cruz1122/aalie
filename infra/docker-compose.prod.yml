services:
  api:
    image: aalie-api:prod
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: aalie-api
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CORS_ENABLED: "0"
      API_INTERNAL_BASE_URL: "http://api:8000"
      QUIZ_DATA_DIR: "/usr/src/app/packages/content-data/quizzes"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: aalie-web:prod
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: aalie-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_INTERNAL_BASE_URL: "http://api:8000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
