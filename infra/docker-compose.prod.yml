services:
  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    container_name: aalie-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aalie}
      POSTGRES_USER: ${POSTGRES_USER:-aalie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aalie-local-only}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-prod-data:/var/lib/postgresql

  api:
    image: aalie-api:prod
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: aalie-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CORS_ENABLED: "0"
      API_INTERNAL_BASE_URL: "http://api:8000"
      QUIZ_DATA_DIR: "/usr/src/app/packages/content-data/quizzes"
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://aalie:aalie-local-only@postgres:5432/aalie}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: aalie-web:prod
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: aalie-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_INTERNAL_BASE_URL: "http://api:8000"
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://aalie:aalie-local-only@postgres:5432/aalie}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-prod-data:
