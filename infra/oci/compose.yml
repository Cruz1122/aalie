name: aalie

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    container_name: aalie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - aalie-internal

  api:
    image: ghcr.io/cruz1122/aalie-api:${AALIE_TAG:?AALIE_TAG must be set}
    container_name: aalie-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL must be set}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aalie-internal

  web:
    image: ghcr.io/cruz1122/aalie-web:${AALIE_TAG:?AALIE_TAG must be set}
    container_name: aalie-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_INTERNAL_BASE_URL: "http://api:8000"
      DATABASE_URL: ${WEB_DATABASE_URL:?WEB_DATABASE_URL must be set}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aalie-internal

  caddy:
    image: caddy:2.11.4-alpine
    container_name: aalie-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aalie-internal

networks:
  aalie-internal:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
