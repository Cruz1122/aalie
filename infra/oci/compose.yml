name: aalie

services:
  api:
    image: ghcr.io/cruz1122/aalie-api:${AALIE_TAG:?AALIE_TAG must be set}
    container_name: aalie-api
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aalie-internal

  web:
    image: ghcr.io/cruz1122/aalie-web:${AALIE_TAG:?AALIE_TAG must be set}
    container_name: aalie-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_INTERNAL_BASE_URL: "http://api:8000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - aalie-internal

  caddy:
    image: caddy:2.11.4-alpine
    container_name: aalie-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aalie-internal

networks:
  aalie-internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
